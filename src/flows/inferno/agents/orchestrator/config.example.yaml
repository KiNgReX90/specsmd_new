# INFERNO per-project configuration. Copy to .specs-inferno/config.yaml in the
# consuming repo and fill in your values, or run /specsmd-inferno-config to be
# walked through it. Read by the orchestrator agent and by
# skills/orchestrate/scripts/run.cjs. Every key is optional: a missing key falls
# back to host and project defaults, so an absent config still yields a working
# flow. This file is where ALL project- and machine-specific values live; the
# flow files stay portable. The values below are examples, not defaults to copy.

host: claude                      # claude or codex: the fleet this file configures, which decides the agent names run.cjs prints; when absent, codex for config.codex.yaml and claude for any other file

autonomy:
  level: full                     # full or review; accepted for compatibility, the planner never pauses either way

# Model per builder tier. Values are passed VERBATIM as the per-dispatch model override,
# so use a form the host accepts (full model IDs keep a tier pinned to a release).
models:
  strong: claude-opus-5-5         # builders on complexity medium and high
  cheap: claude-sonnet-5-5        # builders on complexity low
  escalate: claude-opus-5-5       # the fresh builder that takes over an item after two strong-tier rejections

# Optional: model and effort per role, rendered into the installed agent and command
# files at the next install, so a host never edits an installed file. A role or key
# left out keeps the flow default shown here. Codex roles live in config.codex.yaml.
# roles:
#   builder: {model: claude-opus-5-5, effort: high}
#   builder-cheap: {model: claude-sonnet-5-5, effort: high}
#   builder-escalate: {model: claude-opus-5-5, effort: xhigh}
#   config: {model: claude-sonnet-5-5, effort: high}
#   oracle: {model: claude-opus-5-5, effort: xhigh}
#   planner: {model: claude-opus-5-5, effort: xhigh}

# planner:
#   test_trees: ["src/**/*.test.ts", "e2e/**"]          # the trees the planner's blast-radius grep covers; omit for every test tree

# budget:
#   script: ~/tools/flow-text-budget.py                 # the flow text budget script; else INFERNO_FLOW_BUDGET, else $XDG_DATA_HOME/specsmd-inferno/flow-text-budget.py

review:
  model: claude-opus-5-5          # the cold reviewer run.cjs review dispatches after every item and before the gate

verification:
  finalize:                       # ordered shell commands forming the authoritative gate, run once per intent
    - npm run check
    - cargo test --workspace
    - npm run test:e2e
  integrate:                      # optional: the cheap checks, run by `run.cjs integrate` after every item lands, on the committed tree with the base folded in; a red goes back to the warm builder instead of waiting for the gate
    - npm run check
  finalize_scopes:                # optional: a listed command runs only when the diff since the merge base touches a matching path, an unlisted command always runs
    "cargo test --workspace": ["src-tauri/**", "Cargo.*"]
    "npm run test:e2e": ["src/**", "src-tauri/**", "e2e/**", "package.json", "package-lock.json", "playwright.config.*"]
  # Lanes, optional: gate --detach starts each lane whose scope the diff since the merge base touched, gate --wait waits
  # for it, and green owes the smoke lane while it is in scope. A --config file inherits each lane it does not set.
  # Exit contract of a lane command: 0 green, 10 product red, 11 instrument red, and any other code is instrument red.
  # The host runner retries once itself and the flow never retries a lane. An instrument red passes only against a
  # harness fix already on the base branch, through the step gate --wait prints.
  smoke:                          # a short smoke run of the built app
    command: npm run smoke
    scope: ["src/**", "src-tauri/**"]
  windows:                        # the suite on a Windows machine
    command: npm run test:windows
    scope: ["src/**", "src-tauri/**"]

doubles:                          # optional: refuses a branch that raises the count of test files matching pattern, against the merge base; a --config file inherits it
  pattern: '__TAURI_INTERNALS__'  # a regex in single quotes for a hand-built double; paths and exclude are globs
  paths: ['e2e/**']
  exclude: ['e2e/contract.ts']

wiring:                           # optional: per kind (command, table or event), the host file that registers it; frontier refuses an item that consumes one no item of its intent provides and this file does not register; a --config file inherits it
  command:
    file: src-tauri/src/commands/mod.rs
    within: 'generate_handler!\[([\s\S]*?)\]'   # a regex in single quotes; its last group is the registering block
    name: '(?:\w+::)*(\w+)'                     # a regex run over that block; its last group is one registered name

worktree:
  bootstrap:                      # optional: commands run inside a fresh intent worktree before the first dispatch
    - npm ci

dispatch:
  constraints:                    # optional: lines pasted VERBATIM into every builder and tester dispatch (machine limits, wrappers, what may not run in parallel)
    - "Heavy commands (builds, test suites, cargo) run bare; a machine-wide guardrail wraps them. Exit 137 or 143 is the cap: run once more, then report."

# Delivery mode: how the orchestrator integrates and closes an intent.
#   auto-close    (default) commit each item on the intent branch, then merge
#                 locally into the base branch, tear down the worktree, push.
#   merge-request each item lands via a non-blocking merge request, and the
#                 intent closes by opening one merge request into the base
#                 branch as the single human review gate. Uses gh or glab.
# delivery:
#   mode: auto-close              # auto-close or merge-request
#   base_branch: main             # the branch an intent merges into; omit to have the orchestrator propose and confirm

# recovery:
#   idle_minutes: 60                                     # an in_progress intent is offered for recovery only after this long with no process, edit or commit in its worktree

# halt:
#   flag_file: /absolute/path/to/HALT                    # checked before every dispatch round
#   wait_script: /absolute/path/to/wait-for-reset.sh     # launched in the background at halt, exits when the budget window resets

# knowledge:
#   index: docs/knowledge/index.md                       # index builders walk first when curated context is insufficient
